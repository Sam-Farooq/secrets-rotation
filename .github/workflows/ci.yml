name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: ruff check .

      - run: ruff format --check .

      # targets.toml is the single source of truth for the schedules and the
      # IAM policy. A target added without re-running this gets a schedule
      # from nowhere and no permission to touch its secret.
      - name: generated files are current
        run: python scripts/render.py --check

      # No AWS account, no Vault, no database, no network. moto stubs Secrets
      # Manager and IAM; Vault, Postgres and the clock are replaced by
      # tests/fakes.py. The credentials below are the strings moto expects, so
      # a test that reached real AWS would fail on them rather than succeed
      # quietly.
      - name: pytest
        env:
          AWS_DEFAULT_REGION: eu-west-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SESSION_TOKEN: testing
        run: pytest -q --tb=short

      # The package has to import without the postgres extra, because that is
      # how it is installed everywhere except the task that rotates.
      - name: psycopg is optional
        run: python -c "import rotator.database; print(rotator.database.PostgresAdmin)"

  # The adapter against a real server. The offline job above proves the tool
  # agrees with tests/fakes.py; this one proves tests/fakes.py agrees with
  # Postgres, which is the half a fake cannot do for itself.
  #
  # scram-sha-256 is set explicitly rather than relied on. The image defaults
  # to it, but a password rotation tool whose tests pass under `trust` has
  # tested nothing, and that failure is silent.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: rotator-ci
          POSTGRES_DB: rotator_contract
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev,postgres]"

      # If this prints anything but scram-sha-256 the run is worthless, so it
      # fails here rather than going green on skipped assertions.
      - name: the server enforces scram
        env:
          PGPASSWORD: rotator-ci
        run: |
          method=$(psql -h localhost -U postgres -d rotator_contract -tAc \
            "SELECT auth_method FROM pg_hba_file_rules WHERE type='host' AND error IS NULL LIMIT 1")
          echo "pg_hba host auth_method: $method"
          test "$method" = "scram-sha-256"

      - name: the live tier
        env:
          ROTATOR_TEST_DSN: postgresql://postgres:rotator-ci@localhost:5432/rotator_contract
        run: pytest -m live -q --tb=short -rs

  # The store against a real Vault. Same arrangement as the Postgres job: the
  # offline job proves the tool agrees with tests/fakes.py, this one proves
  # tests/fakes.py agrees with Vault.
  #
  # `docker run` rather than a service container, because a service takes no
  # command and this image needs `server -dev` to be one.
  vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: a Vault to run against
        run: |
          docker run -d --name vault \
            -p 8200:8200 --cap-add=IPC_LOCK \
            -e VAULT_DEV_ROOT_TOKEN_ID=rotator-ci \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:2.1.2 server -dev
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8200/v1/sys/health

      # A KV v1 mount answers the same URLs and ignores options.cas, so a tier
      # pointed at one would skip itself and leave the job green. It fails
      # here instead.
      - name: the mount is KV v2
        run: |
          version=$(curl -sf -H "X-Vault-Token: rotator-ci" \
            http://127.0.0.1:8200/v1/sys/mounts \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['secret/']['options']['version'])")
          echo "secret/ kv version: $version"
          test "$version" = "2"

      - name: the live tier
        env:
          ROTATOR_TEST_VAULT_ADDR: http://127.0.0.1:8200
          ROTATOR_TEST_VAULT_TOKEN: rotator-ci
        run: pytest -m live_vault -q --tb=short -rs

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - run: terraform fmt -check -recursive

      # -backend=false, so this needs no state bucket, takes no lock and uses
      # no credentials. It downloads the provider, which is the only network
      # this job touches.
      - run: terraform init -backend=false -input=false

      - run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - run: tflint --recursive
