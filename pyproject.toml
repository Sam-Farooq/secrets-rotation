[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secrets-rotation"
# Pre-1.0 and staying there until this has rotated something real. The state
# machine and the CLI contract are settled; both adapters now run against the
# thing they adapt, Postgres 16 and Vault 2.1.2, in CI on every pull request.
version = "0.15.0"
description = "Two phase credential rotation: verify the replacement, then revoke"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
]

[project.optional-dependencies]
# psycopg is an extra, and rotator/database.py imports it inside the methods,
# so the package installs and the whole suite runs without a compiler.
postgres = ["psycopg[binary]>=3.2.0"]
dev = ["moto[iam,secretsmanager]==5.2.3", "pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
rotator = "rotator.cli:main"

[tool.setuptools]
packages = ["rotator", "rotator.stores"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fakes.py is imported by name rather than as a package, because it is
# fixtures for the suite and not part of the shipped tree.
pythonpath = ["tests"]
# The live tiers are off unless asked for, so `pytest` needs no server and no
# Docker. `pytest -m live` and `pytest -m live_vault` run them, `pytest -m ""`
# runs everything. Two markers rather than one so each CI job's count means
# something: a vault test skipping inside the Postgres job would be noise.
addopts = "--strict-markers -m 'not live and not live_vault'"
markers = [
    "live: needs a real Postgres, from ROTATOR_TEST_DSN. Skips when it is unset.",
    "live_vault: needs a real Vault, from ROTATOR_TEST_VAULT_ADDR and _TOKEN. Skips when unset.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The fixtures import boto3 and moto inside the functions on purpose, so the
# AWS environment variables in conftest.py are set before botocore reads them.
"tests/*" = ["E402"]
